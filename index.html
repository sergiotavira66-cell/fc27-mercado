<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado EA FC 27 - Datos Reales</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0c14; color: #fff; padding: 20px; }
        .card { background: #121624; border: 1.5px solid #00e5ff; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 0 15px rgba(0,229,255,0.1); }
        .warning { color: #ff3366; background: rgba(255,51,102,0.1); padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; border: 1px solid #ff3366; }
        .price { font-size: 24px; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="font-family: 'Segoe UI', sans-serif; color: #00e5ff;">Base de Datos PC - EA FC 27</h2>
    <div id="contenedor-cartas">Cargando precios reales del servidor...</div>

    <script>
        const DATA_URL = "mercado_pc.json"; 

        async function cargarDatosReales() {
            try {
                const response = await fetch(DATA_URL); 
                const datos = await response.json();
                
                const contenedor = document.getElementById('contenedor-cartas');
                contenedor.innerHTML = '';

                datos.forEach(carta => {
                    let html = `
                        <div class="card">
                            <h3>${carta.nombre}</h3>
                            <div class="price">${carta.precio_medio.toLocaleString()} monedas</div>
                            <p style="color: #8c9ba5; font-size: 14px; margin-top: 5px;">Basado en la media de ${carta.cartas_analizadas} cartas listadas en PC.</p>
                    `;
                    
                    if (carta.advertencia) {
                        html += `<div class="warning">⚠️ ${carta.advertencia}</div>`;
                    }
                    
                    html += `</div>`;
                    contenedor.innerHTML += html;
                });
            } catch (error) {
                document.getElementById('contenedor-cartas').innerHTML = "Error al cargar los datos. Asegúrate de ejecutar primero el script de Python para generar el archivo JSON.";
            }
        }

        cargarDatosReales();
    </script>

    <footer style="margin-top: 40px; text-align: center; color: #8c9ba5; font-size: 13px;">
        Creador: Sergio Tavira | Backend Python + Frontend HTML
    </footer>
</body>
</html>
